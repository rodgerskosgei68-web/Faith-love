<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup Animation</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 20%,#302080,transparent 35%),
        radial-gradient(circle at 80% 80%,#151a55,transparent 35%),
        #08091c;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* MAIN CARD */
.auth-card{
    position:relative;
    width:900px;
    max-width:94%;
    height:540px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:
        0 30px 80px rgba(0,0,0,.45);
    perspective:1500px;
}

/* LOGIN / SIGNUP CONTENT */
.panel{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    padding:55px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:
        transform .9s cubic-bezier(.77,0,.18,1),
        opacity .5s;
}

.login{
    left:0;
    background:#fff;
}

.signup{
    right:0;
    background:#fff;
}

/* TITLES */
.logo{
    font-size:15px;
    font-weight:bold;
    color:#5735dc;
    margin-bottom:45px;
}

h1{
    color:#16162a;
    font-size:36px;
    margin-bottom:10px;
}

.subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:28px;
}

/* INPUTS */
.input{
    width:100%;
    padding:15px 17px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:14px;
    transition:.3s;
}

.input:focus{
    border-color:#5935e5;
    box-shadow:0 0 0 3px rgba(89,53,229,.1);
}

/* BUTTON */
.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #5632df,
        #7146ed
    );
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
    box-shadow:
        0 10px 25px rgba(88,50,220,.25);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

/* CHECKBOX */
.remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:#777;
    font-size:12px;
    margin:4px 0 15px;
}

/* DIVIDER */
.divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:#aaa;
    font-size:12px;
    margin:20px 0;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#eee;
}

/* SOCIAL */
.social{
    display:flex;
    gap:10px;
}

.social button{
    flex:1;
    padding:11px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
}

/* CENTER OVERLAY */
.overlay{
    position:absolute;
    top:0;
    left:50%;
    width:50%;
    height:100%;
    z-index:10;
    overflow:hidden;
    transform-style:preserve-3d;
    transition:
        transform .9s cubic-bezier(.77,0,.18,1);
}

.overlay-inner{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:50px;
    background:
        linear-gradient(
            145deg,
            #5933df,
            #3d50df,
            #5740ee
        );
    color:white;
    position:relative;
    overflow:hidden;
}

/* DECORATIVE BLOBS */
.blob{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.09);
    filter:blur(2px);
}

.blob.one{
    width:300px;
    height:300px;
    top:-120px;
    right:-100px;
}

.blob.two{
    width:250px;
    height:250px;
    bottom:-100px;
    left:-100px;
}

.blob.three{
    width:100px;
    height:100px;
    top:45%;
    right:20%;
    background:rgba(255,255,255,.06);
}

/* OVERLAY TEXT */
.overlay-content{
    position:relative;
    z-index:3;
}

.overlay-content h2{
    font-size:38px;
    margin-bottom:15px;
}

.overlay-content p{
    color:rgba(255,255,255,.8);
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.switch-btn{
    padding:13px 28px;
    border:1px solid rgba(255,255,255,.6);
    background:transparent;
    color:white;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
}

/* SIGNUP MODE */
.auth-card.show-signup .overlay{
    transform:translateX(-100%);
}

.auth-card.show-signup .login{
    transform:translateX(100%);
}

.auth-card.show-signup .signup{
    transform:translateX(-100%);
}

/* 3D FEEL */
.auth-card.show-signup .overlay-inner{
    transform:rotateY(0deg);
}


/* =========================================
   MOBILE FIX
   ========================================= */

@media(max-width:700px){

    body{
        min-height:100svh;
        padding:20px 0;
        overflow:auto;
        align-items:center;
    }

    .auth-card{
        width:92%;
        max-width:430px;
        height:760px;
        min-height:760px;
        border-radius:22px;
        overflow:hidden;
    }

    .panel{
        width:100%;
        height:100%;
        padding:300px 35px 35px;
        justify-content:flex-start;
        overflow:hidden;
    }

    .login{
        left:0;
    }

    .signup{
        right:-100%;
    }

    /* Blue panel stays at the top */
    .overlay{
        width:100%;
        left:0;
        top:0;
        height:260px;
        z-index:10;
    }

    .overlay-inner{
        padding:30px;
    }

    .overlay-content h2{
        font-size:28px;
        margin-bottom:10px;
    }

    .overlay-content p{
        font-size:13px;
        margin-bottom:18px;
    }

    .switch-btn{
        padding:11px 24px;
    }

    /* Login content starts BELOW overlay */
    .login .logo,
    .signup .logo{
        margin-bottom:25px;
    }

    h1{
        font-size:32px;
        margin-bottom:9px;
    }

    .subtitle{
        margin-bottom:22px;
    }

    .input{
        padding:14px 16px;
        margin-bottom:13px;
    }

    .btn{
        padding:14px;
    }

    .divider{
        margin:16px 0;
    }

    /*
       Signup animation on mobile:
       overlay moves down after switching.
    */
    .auth-card.show-signup .overlay{
        transform:translateY(192%);
    }

    .auth-card.show-signup .login{
        transform:translateY(-100%);
    }

    .auth-card.show-signup .signup{
        transform:translateX(-100%);
    }
}


/* SMALL PHONES */
@media(max-width:380px){

    .auth-card{
        width:94%;
        height:720px;
        min-height:720px;
    }

    .panel{
        padding:285px 25px 25px;
    }

    .overlay{
        height:245px;
    }

    .overlay-content h2{
        font-size:25px;
    }

    .overlay-content p{
        font-size:12px;
    }

    h1{
        font-size:28px;
    }

    .logo{
        font-size:14px;
    }
}
</style>
</head>


<body>

<div class="auth-card" id="authCard">

    <!-- LOGIN -->
    <div class="panel login">

        <div class="logo">
            ✦ CODE CANDY
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="subtitle">
            Sign in to continue to your account
        </p>

        <input
            class="input"
            type="email"
            placeholder="Email address">

        <input
            class="input"
            type="password"
            placeholder="Password">

        <label class="remember">
            <input type="checkbox">
            Remember me
        </label>

        <button class="btn">
            Sign In
        </button>

        <div class="divider">
            OR
        </div>

        <div class="social">
            <button>Google</button>
            <button>Apple</button>
        </div>

    </div>


    <!-- SIGNUP -->
    <div class="panel signup">

        <div class="logo">
            ✦ CODE CANDY
        </div>

        <h1>
            Create account
        </h1>

        <p class="subtitle">
            Join us and create your account
        </p>

        <input
            class="input"
            type="text"
            placeholder="Full name">

        <input
            class="input"
            type="email"
            placeholder="Email address">

        <input
            class="input"
            type="password"
            placeholder="Create password">

        <button class="btn">
            Create Account
        </button>

        <div class="divider">
            OR
        </div>

        <div class="social">
            <button>Google</button>
            <button>Apple</button>
        </div>

    </div>


    <!-- ANIMATED OVERLAY -->
    <div class="overlay">

        <div class="overlay-inner">

            <div class="blob one"></div>
            <div class="blob two"></div>
            <div class="blob three"></div>

            <div class="overlay-content">

                <h2 id="overlayTitle">
                    New here?
                </h2>

                <p id="overlayText">
                    Create your account and
                    discover something amazing.
                </p>

                <button
                    class="switch-btn"
                    id="switchBtn">
                    Create Account
                </button>

            </div>

        </div>

    </div>

</div>


<script>

const card =
    document.getElementById("authCard");

const switchBtn =
    document.getElementById("switchBtn");

const title =
    document.getElementById("overlayTitle");

const text =
    document.getElementById("overlayText");

let signup = false;

switchBtn.addEventListener("click",()=>{

    signup = !signup;

    if(signup){

        card.classList.add("show-signup");

        title.textContent =
            "Already have an account?";

        text.textContent =
            "Welcome back. Sign in and continue your journey.";

        switchBtn.textContent =
            "Sign In";

    }else{

        card.classList.remove("show-signup");

        title.textContent =
            "New here?";

        text.textContent =
            "Create your account and discover something amazing.";

        switchBtn.textContent =
            "Create Account";

    }

});

</script>

</body>
</html>
